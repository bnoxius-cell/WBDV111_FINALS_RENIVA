<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Properties | CozyCorner</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container py-section">
        <h1 class="text-primary">Admin Dashboard</h1>
        
        <div class="dashboard-layout">
            <aside class="sidebar">
                <ul class="sidebar-menu">
                    <li><a href="dashboard.html">Overview</a></li>
                    <li><a href="manage-reservations.html">Reservations</a></li>
                    <li><a href="manage-properties.html" class="active">Properties</a></li>
                    <li><a href="support-queue.html">Support Queue</a></li>
                    <li><a href="profile-management.html">Profile Settings</a></li>
                    <li class="mt-4 border-t pt-3"><a href="#" class="sidebar-logout-btn text-crimson font-bold"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle mr-2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</a></li>
                </ul>
            </aside>
            
            <section class="dashboard-content">
                <div class="card card-lg m-0 max-w-100">
                    <h2 class="mb-2">Add New Property</h2>
                    <p class="subtitle text-center mb-4">Publish a new unit directly to the database.</p>
                    
                    <form id="add-property-form" class="flex-col gap-1">
                        <div class="grid-2-col gap-1">
                            <div class="form-group">
                                <label class="form-label">Property Name</label>
                                <input type="text" id="prop-name" class="form-control" required placeholder="e.g. Cozy Loft">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Location</label>
                                <input type="text" id="prop-location" class="form-control" required placeholder="City, Region">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Price per Night (₱)</label>
                                <input type="number" id="prop-price" class="form-control" required min="0" placeholder="e.g. 3500">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Property Type</label>
                                <select id="prop-type" class="form-control" required style="background-color: var(--secondary-color)">
                                    <option value="studio">Studio</option>
                                    <option value="family">Family</option>
                                    <option value="deluxe">Deluxe</option>
                                    <option value="suite">Suite</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Recommended Guests</label>
                                <input type="number" id="prop-guests" class="form-control" required min="1" max="20" value="2">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Bed Setup</label>
                                <input type="text" id="prop-beds" class="form-control" required placeholder="e.g. 1 Bedroom">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Cover Image Style</label>
                                <select id="prop-image" class="form-control" required style="background-color: var(--secondary-color)">
                                    <option value="img-neon">Neon / Modern</option>
                                    <option value="img-crimson">Crimson / Cozy</option>
                                    <option value="img-azure">Azure / Beach</option>
                                    <option value="img-emerald">Emerald / Nature</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-glow mt-3 w-100">Publish Property</button>
                    </form>
                </div>

                <div class="card card-lg m-0 max-w-100 mt-4">
                    <h2 class="mb-2 text-gold">Published Properties</h2>
                    <p class="subtitle text-center mb-4">View and remove live listings.</p>
                    <div class="listings-grid mt-0" id="admin-properties-grid" style="grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem;"></div>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="../../backend/main.js"></script>
</body>
</html>
