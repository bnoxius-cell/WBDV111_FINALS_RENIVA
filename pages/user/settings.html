<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings | CozyCorner</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/settings.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container py-section">
        <h1 class="text-primary">Profile Settings</h1>
        
        <div class="dashboard-layout">
            <aside class="sidebar card glass-panel p-4 m-0" style="height: fit-content;">
                <ul class="sidebar-menu">
                    <li><a href="dashboard.html">Overview</a></li>
                    <li><a href="my-bookings.html">My Bookings</a></li>
                    <li><a href="settings.html" class="active">Profile Settings</a></li>
                    <li class="mt-4 border-t pt-3"><a href="#" class="sidebar-logout-btn text-crimson font-bold flex-align-center" style="gap: 0.5rem;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg><span>Logout</span></a></li>
                </ul>
            </aside>
            
            <section class="dashboard-content">
                <div class="card glass-panel m-0 max-w-100 w-100 p-lg">
                    <h2 class="mb-2">Account Information</h2>
                    <p class="text-muted text-center mb-4">Update your profile details below.</p>

                    <div class="settings-layout">
                        <!-- Left side for profile picture -->
                        <div class="profile-picture-container">
                            <div class="avatar-upload">
                                <div class="avatar-preview">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="text-muted"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </div>
                                <div class="avatar-edit">
                                    <input type='file' id="imageUpload" accept=".png, .jpg, .jpeg" />
                                    <label for="imageUpload"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></label>
                                </div>
                            </div>
                            <h3 id="profile-username-display" class="text-primary text-capitalize mt-2 mb-0">Guest</h3>
                            <p class="text-muted text-sm">User since Jan 2024</p>
                        </div>

                        <!-- Right side for form -->
                        <div class="profile-form-container">
                            <form>
                                <div class="form-group">
                                    <label class="form-label" for="profile-name">Full Name</label>
                                    <input type="text" id="profile-name" class="form-control" placeholder="Your Name">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="profile-email">Email Address</label>
                                    <input type="email" id="profile-email" class="form-control" placeholder="your@email.com">
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="profile-phone">Phone Number</label>
                                    <input type="tel" id="profile-phone" class="form-control" placeholder="123-456-7890">
                                </div>
                                <div class="text-right mt-4">
                                    <button type="submit" class="btn btn-primary btn-glow">Save Changes</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../../backend/app.js"></script>
    <script src="../../backend/auth.js"></script>
</body>
</html>
