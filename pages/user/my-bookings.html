<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | CozyCorner</title>
    
    <!-- Global Styles & Glassmorphic RPG Theme -->
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="container py-section">
        <h1 class="text-primary">My Bookings</h1>
        
        <div class="dashboard-layout">
            <aside class="sidebar card glass-panel p-4 m-0" style="height: fit-content;">
                <ul class="sidebar-menu">
                    <li><a href="dashboard.html">Overview</a></li>
                    <li><a href="my-bookings.html" class="active">My Bookings</a></li>
                    <li><a href="settings.html">Profile Settings</a></li>
                    <li class="mt-4 border-t pt-3"><a href="#" class="sidebar-logout-btn text-crimson font-bold flex-align-center" style="gap: 0.5rem;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg><span>Logout</span></a></li>
                </ul>
            </aside>
            
            <section class="dashboard-content">
                <div class="card glass-panel m-0 max-w-100 w-100 p-lg">
            <!-- Glassmorphic Tab UI -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="upcoming">Upcoming</button>
                <button class="tab-btn" data-tab="past">Past</button>
                <button class="tab-btn" data-tab="canceled">Canceled</button>
            </div>

            <!-- Upcoming Bookings View -->
            <div id="upcoming" class="tab-content active">
                <h2 class="text-green mb-2">Upcoming Adventures</h2>
                <div id="upcoming-container" class="flex-col gap-1"></div>
            </div>

            <!-- Past Bookings View -->
            <div id="past" class="tab-content">
                <h2 class="text-gold mb-2">Past Memories</h2>
                <div id="past-container" class="flex-col gap-1"></div>
            </div>

            <!-- Canceled Bookings View -->
            <div id="canceled" class="tab-content">
                <h2 class="text-crimson mb-2">Canceled Trips</h2>
                <div id="canceled-container" class="flex-col gap-1"></div>
            </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Review & Complete Stay Modal -->
    <div id="review-modal" class="modal-overlay hidden">
        <div class="card m-0 mx-1 max-w-400 w-100">
            <h2 class="mb-1 text-primary">How was your stay?</h2>
            <p id="review-property-name" class="text-muted mb-3">Property Name</p>
            <form id="review-form">
                <input type="hidden" id="review-booking-id">
                <div class="form-group">
                    <label class="form-label" for="review-rating">Rating (1-5 Stars)</label>
                    <select id="review-rating" class="form-control" required>
                        <option value="5">5 - Excellent (★ 5.0)</option>
                        <option value="4">4 - Very Good (★ 4.0)</option>
                        <option value="3">3 - Good (★ 3.0)</option>
                        <option value="2">2 - Fair (★ 2.0)</option>
                        <option value="1">1 - Poor (★ 1.0)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="review-text">Comments</label>
                    <textarea id="review-text" class="form-control resize-y" rows="4" placeholder="Tell us about your experience..." required></textarea>
                </div>
                <div class="flex-col gap-1 mt-3">
                    <button type="submit" class="btn btn-primary btn-glow w-100">Submit Review & Complete</button>
                    <button type="button" id="cancel-review-btn" class="btn btn-outline w-100">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer Component Loader -->
    <div id="footer-placeholder"></div>

    <script type="module" src="../../backend/main.js"></script>
</body>
</html>
