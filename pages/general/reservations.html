<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations | CozyCorner</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container py-section">
        <div class="text-center">
            <h1 class="text-primary">Available Properties</h1>
            <p class="text-muted">Browse our exclusive collection of stays.</p>
        </div>

        <div class="page-with-sidebar">
            <!-- Filter Sidebar -->
            <form id="search-form" class="card filter-sidebar">
                <h3 class="mb-0">Filter Stays</h3>
                <div class="filter-controls">
                    <input type="text" id="location" class="form-control" placeholder="Location">
                    <div class="form-group mb-0 custom-select-container" id="res-type-wrapper">
                        <label class="form-label">Property Type</label>
                        <div class="custom-select-trigger form-control" id="res-type-trigger" style="cursor: pointer; height: auto;">
                            <span>All Types</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-muted"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="custom-select-dropdown hidden">
                            <div class="custom-select-option selected" data-value="">All Types</div>
                            <div class="custom-select-option" data-value="suite">Suite</div>
                            <div class="custom-select-option" data-value="studio">Studio</div>
                            <div class="custom-select-option" data-value="family">Family</div>
                            <div class="custom-select-option" data-value="deluxe">Deluxe</div>
                        </div>
                        <input type="hidden" id="property-type" name="property-type" value="">
                    </div>
                    <div class="form-group mb-0 custom-calendar-wrapper" id="res-dates-wrapper">
                        <label class="form-label">Dates</label>
                        <div class="custom-date-trigger form-control" id="res-date-trigger" style="cursor: pointer; height: auto;">Select dates</div>
                        <input type="hidden" id="checkin" name="checkin">
                        <input type="hidden" id="checkout" name="checkout">
                    </div>
                    <div class="form-group mb-0">
                        <label for="guests" class="form-label">Guests</label>
                        <div class="stepper-input-group">
                            <button type="button" class="stepper-btn-form" data-step="down" aria-label="Remove one guest">-</button>
                            <input type="number" id="guests" class="form-control" value="1" min="1" max="20" readonly>
                            <button type="button" class="stepper-btn-form" data-step="up" aria-label="Add one guest">+</button>
                        </div>
                    </div>
                    <div class="form-group mb-0">
                        <label for="max-price" class="form-label">Max Price</label>
                        <div class="input-group">
                            <span class="input-prefix">₱</span>
                            <input type="number" id="max-price" name="max-price" class="form-control pl-prefix" placeholder="Any Range" min="1">
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-glow w-100 mt-3">Search</button>
            </form>

            <div class="listings-grid featured-listings" id="all-properties-grid"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="../../backend/main.js"></script>
</body>
</html>
