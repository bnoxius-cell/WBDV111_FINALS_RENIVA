<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property | CozyCorner</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container py-section">
        <h1 class="text-primary">Superadmin Dashboard</h1>
        
        <div class="dashboard-layout">
            <aside class="sidebar">
                <ul class="sidebar-menu">
                    <li><a href="dashboard.html">Overview</a></li>
                    <li><a href="manage-reservations.html">Reservations</a></li>
                    <li><a href="manage-properties.html" class="active">Properties</a></li>
                    <li><a href="manage-admins.html">Manage Admins</a></li>
                    <li><a href="support-queue.html">Support Queue</a></li>
                    <li><a href="profile-management.html">Profile Settings</a></li>
                    <li class="mt-4 border-t pt-3"><a href="#" class="sidebar-logout-btn text-crimson font-bold"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle mr-2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</a></li>
                </ul>
            </aside>
            
            <section class="dashboard-content">
                <div class="card card-lg m-0 max-w-100">
                    <h2 class="mb-2">Add New Property</h2>
                    <p class="subtitle text-center mb-4">Create a new listing for the platform.</p>

                    <form id="add-property-form" class="flex-col gap-1 max-w-800 mx-auto mt-4">
                        <div class="form-group">
                            <label class="form-label" for="prop-name">Property Name</label>
                            <input type="text" id="prop-name" class="form-control" required placeholder="e.g. Cozy Loft in the City">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="prop-location">Location</label>
                            <input type="text" id="prop-location" class="form-control" required placeholder="e.g. Makati City, Philippines">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="prop-price">Price per Night (₱)</label>
                            <input type="number" id="prop-price" class="form-control" required placeholder="e.g. 2500" min="0" step="0.01">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="prop-type">Property Type</label>
                            <select id="prop-type" class="form-control" required>
                                <option value="studio">Studio</option>
                                <option value="apartment">Apartment</option>
                                <option value="house">House</option>
                                <option value="villa">Villa</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="prop-guests">Recommended Guests</label>
                            <input type="number" id="prop-guests" class="form-control" required placeholder="e.g. 2" min="1">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="prop-beds">Beds Description</label>
                            <input type="text" id="prop-beds" class="form-control" required placeholder="e.g. 1 Queen Bed, 1 Sofa Bed">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="prop-image">Cover Image Class</label>
                            <select id="prop-image" class="form-control" required>
                                <option value="img-room1">Room 1</option>
                                <option value="img-room2">Room 2</option>
                                <option value="img-neon">Neon</option>
                                <option value="img-crimson">Crimson</option>
                                <option value="img-azure">Azure</option>
                                <option value="img-emerald">Emerald</option>
                                <option value="img-pool">Pool</option>
                                <option value="img-view">View</option>
                                <option value="img-bathroom">Bathroom</option>
                                <option value="img-kitchen">Kitchen</option>
                            </select>
                        </div>

                        <div class="flex-align-center gap-1 mt-4">
                            <a href="manage-properties.html" class="btn btn-outline w-fit">Cancel</a>
                            <button type="submit" class="btn btn-primary btn-glow w-fit">Publish Property</button>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="../../backend/main.js"></script>
</body>
</html>
