<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Management | CozyCorner</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container py-section">
        <h1 class="text-primary">Superadmin Dashboard</h1>
        
        <div class="dashboard-layout">
            <aside class="sidebar">
                <ul class="sidebar-menu">
                    <li><a href="dashboard.html">Overview</a></li>
                    <li><a href="manage-reservations.html">Reservations</a></li>
                    <li><a href="manage-properties.html">Properties</a></li>
                    <li><a href="manage-admins.html">Manage Admins</a></li>
                    <li><a href="support-queue.html">Support Queue</a></li>
                    <li><a href="profile-management.html" class="active">Profile Settings</a></li>
                    <li class="mt-4 border-t pt-3"><a href="#" class="sidebar-logout-btn text-crimson font-bold"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="align-middle mr-2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</a></li>
                </ul>
            </aside>
            
            <section class="dashboard-content">
                <div class="card card-lg m-0 max-w-100">
                    <h2 class="mb-2">Profile Management</h2>
                    <p class="subtitle text-center mb-4">Update your superadmin profile credentials.</p>

                    <form id="update-profile-form" class="flex-col gap-1 max-w-400 mx-auto mt-4">
                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" id="profile-username" class="form-control" readonly style="background-color: var(--secondary-color); cursor: not-allowed;">
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Password</label>
                            <input type="password" id="profile-new-password" class="form-control" required placeholder="Enter a new password">
                        </div>
                        <button type="submit" class="btn btn-primary btn-glow mt-3 w-100">Update Password</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="../../backend/main.js"></script>
</body>
</html>
